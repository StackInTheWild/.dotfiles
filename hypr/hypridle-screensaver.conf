# Hypridle Configuration with Screensaver Mode
# See https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock-screensaver.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim screen after 3 minutes
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Turn off keyboard backlight after 3 minutes
listener {
    timeout = 180
    on-timeout = brightnessctl -sd platform::kbd_backlight set 0
    on-resume = brightnessctl -rd platform::kbd_backlight
}

# Start screensaver after 5 minutes (shows clock)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off screen after 10 minutes (if still locked)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 20 minutes
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}

# Alternative: Use custom screensaver script instead of hyprlock
# Uncomment and modify the lock_cmd above:
# lock_cmd = pidof hyprlock || ~/.config/hypr/screensaver.sh clock 300

# Screensaver options:
# - clock: Simple clock (default hyprlock)
# - matrix: Matrix-style falling text
# - pipes: Colorful pipes animation
# - starfield: Space/aquarium theme
# - blank: Just blank screen
# - video: Play a video loop
