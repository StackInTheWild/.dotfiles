# Hyprlock Configuration
# See https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

###################
### GENERAL ###
###################
general {
    disable_loading_bar = false
    grace = 0
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

###################
### BACKGROUND ###
###################
background {
    monitor =
    path = screenshot   # screenshot of your current screen
    # path = ~/Pictures/Wallpapers/lockscreen.png  # alternative: use a specific wallpaper

    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

###################
### INPUT FIELD ###
###################
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3

    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)

    fade_on_empty = true
    fade_timeout = 1000

    placeholder_text = <i>Input Password...</i>
    hide_input = false

    rounding = 10
    check_color = rgb(f9e2af)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300

    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1

    position = 0, -120
    halign = center
    valign = center
}

###################
### TIME ###
###################
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%H:%M")</big></b>"
    color = rgb(cdd6f4)
    font_size = 90
    font_family = JetBrains Mono Nerd Font
    shadow_passes = 3
    shadow_size = 8

    position = 0, 150
    halign = center
    valign = center
}

###################
### DATE ###
###################
label {
    monitor =
    text = cmd[update:43200000] echo "<b>$(date +"%A, %B %d")</b>"
    color = rgb(cdd6f4)
    font_size = 22
    font_family = JetBrains Mono Nerd Font

    position = 0, 50
    halign = center
    valign = center
}

###################
### USER ###
###################
label {
    monitor =
    text = Hi there, $USER
    color = rgb(cdd6f4)
    font_size = 20
    font_family = JetBrains Mono Nerd Font

    position = 0, -50
    halign = center
    valign = center
}

###################
### BATTERY ###
###################
label {
    monitor =
    text = cmd[update:5000] echo "  $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(cdd6f4)
    font_size = 16
    font_family = JetBrains Mono Nerd Font

    position = -30, -30
    halign = right
    valign = top
}

###################
### LAYOUT ###
###################
label {
    monitor =
    text = cmd[update:1000] echo "$(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap' | head -n1)"
    color = rgb(cdd6f4)
    font_size = 16
    font_family = JetBrains Mono Nerd Font

    position = 30, -30
    halign = left
    valign = top
}
