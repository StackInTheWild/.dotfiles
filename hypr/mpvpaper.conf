# MPVPaper Configuration for Animated Wallpapers
# Place video files in ~/Videos/Wallpapers/

# Example usage:
# mpvpaper -o "loop" eDP-1 ~/Videos/Wallpapers/video.mp4

# Common MPV options for wallpapers:
# -o "loop"                    # Loop the video
# -o "no-audio"                # Disable audio
# -o "panscan=1.0"             # Fill the screen
# -o "hwdec=auto"              # Hardware decoding
# -o "vo=gpu"                  # GPU rendering

# Recommended video formats:
# - MP4 (H.264/H.265) - Best compatibility
# - WebM - Good for transparent backgrounds
# - GIF - Simple animations

# Example videos to download:
# Cyberpunk city: https://www.youtube.com/watch?v=... (use yt-dlp)
# Matrix rain: Custom scripts available
# Firewatch style: Animated landscapes

# Script to set animated wallpaper:
# #!/bin/bash
# killall mpvpaper 2>/dev/null
# mpvpaper -o "loop no-audio" '*' ~/Videos/Wallpapers/default.mp4 &

# To start on boot, add to hyprland.conf:
# exec-once = ~/.config/hypr/start-animated-wallpaper.sh
