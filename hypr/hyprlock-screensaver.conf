# Hyprlock Screensaver Configuration
# Minimalist screensaver-style lock screen
# See https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

###################
### GENERAL ###
###################
general {
    disable_loading_bar = true
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

###################
### BACKGROUND ###
###################
background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.0
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

###################
### SCREENSAVER ###
###################

# Large animated clock
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M:%S")</b>"
    color = rgba(205, 214, 244, 0.8)
    font_size = 120
    font_family = JetBrains Mono Nerd Font
    shadow_passes = 4
    shadow_size = 10

    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(205, 214, 244, 0.6)
    font_size = 28
    font_family = JetBrains Mono Nerd Font

    position = 0, -20
    halign = center
    valign = center
}

# Subtle hint to unlock
label {
    monitor =
    text = Press any key to unlock
    color = rgba(205, 214, 244, 0.3)
    font_size = 16
    font_family = JetBrains Mono Nerd Font

    position = 0, -200
    halign = center
    valign = center
}

###################
### INPUT FIELD ###
###################
input-field {
    monitor =
    size = 350, 55
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(137, 180, 250, 0.3)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(205, 214, 244)

    fade_on_empty = true
    fade_timeout = 2000

    placeholder_text =
    hide_input = false

    rounding = 12
    check_color = rgba(166, 227, 161, 0.8)
    fail_color = rgba(243, 139, 168, 0.8)
    fail_text =
    fail_timeout = 1500
    fail_transition = 200

    position = 0, -250
    halign = center
    valign = center
}

###################
### CORNER INFO ###
###################

# Battery (top right)
label {
    monitor =
    text = cmd[update:10000] echo " $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "AC")%"
    color = rgba(205, 214, 244, 0.5)
    font_size = 14
    font_family = JetBrains Mono Nerd Font

    position = -30, -30
    halign = right
    valign = top
}

# Uptime (top left)
label {
    monitor =
    text = cmd[update:60000] echo " $(uptime -p | sed 's/up //')"
    color = rgba(205, 214, 244, 0.5)
    font_size = 14
    font_family = JetBrains Mono Nerd Font

    position = 30, -30
    halign = left
    valign = top
}

# Hostname (bottom left)
label {
    monitor =
    text = $USER@$(cat /etc/hostname)
    color = rgba(205, 214, 244, 0.4)
    font_size = 12
    font_family = JetBrains Mono Nerd Font

    position = 30, 30
    halign = left
    valign = bottom
}

# Weather (optional - requires wttr.in)
label {
    monitor =
    text = cmd[update:3600000] curl -s 'wttr.in/?format=%c+%t' 2>/dev/null || echo ""
    color = rgba(205, 214, 244, 0.5)
    font_size = 14
    font_family = JetBrains Mono Nerd Font

    position = -30, 30
    halign = right
    valign = bottom
}
